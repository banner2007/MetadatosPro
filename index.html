<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metadata Purge Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.umd.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

    <style>
        body { background: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "@ffmpeg/ffmpeg": "https://esm.sh/@ffmpeg/ffmpeg@^0.12.15",
    "@ffmpeg/util": "https://esm.sh/@ffmpeg/util@^0.12.2"
  }
}
</script>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div id="root"></div>

    <div class="glass-panel p-10 rounded-3xl max-w-lg w-full text-center">
        <h1 class="text-5xl font-black mb-4 bg-gradient-to-br from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
            METADATA PRO
        </h1>
        <p class="text-slate-400 mb-10 font-medium">Limpieza profunda de metadatos en el navegador</p>

        <div id="drop-zone" class="border-2 border-dashed border-slate-700 rounded-2xl p-12 cursor-pointer hover:border-indigo-500 hover:bg-indigo-500/5 transition-all group">
            <input type="file" id="file-input" class="hidden" accept="video/*">
            <div class="text-4xl mb-4 group-hover:scale-110 transition-transform">🛡️</div>
            <p id="status-text" class="text-slate-300 font-semibold">Seleccionar video para purgar</p>
        </div>

        <div id="progress-container" class="hidden mt-8">
            <div class="w-full bg-slate-800 rounded-full h-4 overflow-hidden p-1">
                <div id="progress-bar" class="bg-indigo-500 h-full rounded-full w-0 transition-all duration-300 shadow-[0_0_15px_rgba(99,102,241,0.5)]"></div>
            </div>
            <p id="progress-text" class="text-[10px] mt-3 text-indigo-400 font-mono uppercase tracking-[0.2em]">Inicializando motor...</p>
        </div>

        <div id="error-msg" class="hidden mt-6 p-4 bg-red-500/10 border border-red-500/30 rounded-xl">
            <p id="error-detail" class="text-red-400 text-sm font-bold uppercase tracking-tight"></p>
            <button onclick="location.reload()" class="mt-3 text-xs text-white bg-red-600 px-4 py-1 rounded-full hover:bg-red-500">REINTENTAR</button>
        </div>
    </div>

    <script>
        // Acceso seguro a las librerías cargadas vía UMD
        const { FFmpeg } = window.FFmpegWasm;
        const { fetchFile, toBlobURL } = window.FFmpegUtil;

        let ffmpeg = null;

        async function loadFFmpeg() {
            try {
                ffmpeg = new FFmpeg();
                
                // USAMOS ESTA RUTA ESPECÍFICA QUE ES COMPATIBLE CON UMD
                const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
                
                await ffmpeg.load({
                    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                    // Esto es crítico para el error de Worker:
                    workerURL: await toBlobURL(`${baseURL}/ffmpeg-core.worker.js`, 'text/javascript'),
                });
                
                console.log("FFmpeg cargado con éxito");
            } catch (error) {
                console.error("Error de carga:", error);
                showError("Error de seguridad: Bloqueo de Worker detectado.");
            }
        }

        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!ffmpeg) await loadFFmpeg();
            
            document.getElementById('progress-container').classList.remove('hidden');
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('status-text').innerText = "Purgando archivo...";

            try {
                const { name } = file;
                await ffmpeg.writeFile(name, await fetchFile(file));

                ffmpeg.on('progress', ({ progress }) => {
                    const p = Math.round(progress * 100);
                    document.getElementById('progress-bar').style.width = `${p}%`;
                    document.getElementById('progress-text').innerText = `PROCESANDO: ${p}%`;
                });

                // Ejecución de limpieza de metadatos
                await ffmpeg.exec(['-i', name, '-map_metadata', '-1', '-c', 'copy', 'clean_' + name]);

                const data = await ffmpeg.readFile('clean_' + name);
                const url = URL.createObjectURL(new Blob([data.buffer], { type: file.type }));
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'purgado_' + name;
                a.click();

                document.getElementById('progress-text').innerText = "PURGA COMPLETADA";
                document.getElementById('status-text').innerText = "¡ARCHIVO DESCARGADO!";
            } catch (err) {
                console.error(err);
                showError("Fallo en el proceso de limpieza.");
            }
        };

        function showError(msg) {
            document.getElementById('error-msg').classList.remove('hidden');
            document.getElementById('error-detail').innerText = msg;
            document.getElementById('progress-container').classList.add('hidden');
        }

        // Pre-carga del motor
        loadFFmpeg();
    </script>
</body>
</html>
